<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>herdr</title>
<meta name="theme-color" content="#131312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="herdr">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f3f0;
    --surface: #ffffff;
    --surface-2: #eceae5;
    --text: #1c1b18;
    --text-2: #6b6860;
    --line: #dedbd3;
    --accent: #b45309;
    --working: #d97706;
    --idle: #8a8578;
    --done: #15803d;
    --blocked: #dc2626;
    --unknown: #a8a29e;
    --term-bg: #16161a;
    --term-fg: #d6d6dc;
    --shadow: 0 1px 3px rgba(28, 27, 24, .08), 0 4px 14px rgba(28, 27, 24, .06);
    /* ANSI 16-color palette, tuned for the always-dark terminal pane */
    --ansi-0: #3c3c44; --ansi-1: #f2777a; --ansi-2: #99cc99; --ansi-3: #ffcc66;
    --ansi-4: #6699cc; --ansi-5: #cc99cc; --ansi-6: #66cccc; --ansi-7: #cfcfd6;
    --ansi-8: #7a7a84; --ansi-9: #ff9a9e; --ansi-10: #b5e8b5; --ansi-11: #ffe0a3;
    --ansi-12: #8fbce6; --ansi-13: #e0b3e0; --ansi-14: #9ee6e6; --ansi-15: #f4f4f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --surface: #1d1d1b;
      --surface-2: #262624;
      --text: #e8e6e1;
      --text-2: #97948b;
      --line: #33322f;
      --accent: #e8963e;
      --working: #f59e0b;
      --idle: #6f6c63;
      --done: #4ade80;
      --blocked: #f87171;
      --unknown: #78716c;
      --term-bg: #101013;
      --term-fg: #cfcfd6;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { height: 100%; }
  body {
    height: 100%;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- Home ---- */
  #home {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 16px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 32px) max(16px, env(safe-area-inset-left));
  }
  header.app {
    display: flex; align-items: baseline; gap: 10px;
    padding: 8px 2px 20px;
  }
  header.app h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  #conn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--text-2);
  }
  #conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
  #conn.live .dot { background: var(--done); }
  #conn.poll .dot { background: var(--working); }
  #conn.offline .dot { background: var(--blocked); }
  #attention {
    display: none; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; color: var(--blocked);
    padding: 2px 9px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--blocked) 45%, transparent);
    background: color-mix(in srgb, var(--blocked) 10%, transparent);
  }
  #attention.show { display: inline-flex; }
  #notifyBtn {
    display: none; align-self: center; width: 32px; height: 32px; border-radius: 8px;
    font-size: 17px; line-height: 1; opacity: .45;
  }
  #notifyBtn.available { display: inline-flex; align-items: center; justify-content: center; }
  #notifyBtn[aria-pressed="true"] { opacity: 1; }
  #notifyBtn.denied { opacity: .3; text-decoration: line-through; }

  section.ws { margin-bottom: 26px; }
  section.ws h2 {
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
    color: var(--text-2); padding: 0 2px 10px;
    display: flex; align-items: baseline; gap: 8px;
  }
  section.ws h2 .count { font-weight: 400; letter-spacing: 0; text-transform: none; }
  section.ws h2 .add {
    margin-left: auto; align-self: center; width: 32px; height: 32px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; color: var(--text-2);
  }
  section.ws h2 .add:active { background: var(--surface-2); }
  section.ws h2 .add svg { width: 18px; height: 18px; stroke: currentColor; }
  .empty-ws { font-size: 14px; color: var(--text-2); padding: 2px 2px 0; }

  .agent {
    display: flex; flex-wrap: wrap; align-items: center;
    width: 100%; text-align: left;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0 6px 0 16px;
    min-height: 64px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .agent .open {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px;
    padding: 14px 0; text-align: left; cursor: pointer;
    transition: transform .12s ease-out;
  }
  .agent .open:active { transform: scale(.985); }
  .agent .open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .agent .more {
    flex: none; width: 40px; height: 40px; border-radius: 10px; margin-left: 4px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2); font-size: 18px; letter-spacing: .05em;
  }
  .agent .more:active, .agent .more[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
  .agent .title input, #detail .bar .t input {
    width: 100%; font: inherit; color: inherit; background: transparent;
    border: 0; border-bottom: 1px solid var(--accent); padding: 0; outline: none;
  }
  .menu {
    flex-basis: 100%; display: flex; align-items: center; gap: 8px;
    padding: 4px 10px 10px 0; font-size: 13px;
  }
  .menu button {
    height: 32px; padding: 0 12px; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  }
  .menu button.danger { color: var(--blocked); }
  .menu .q { color: var(--text-2); margin-right: 2px; }
  #detail .menu {
    position: absolute; right: max(8px, env(safe-area-inset-right)); top: 100%;
    flex-basis: auto; padding: 8px; border-radius: 10px; z-index: 11;
    background: color-mix(in srgb, var(--term-bg) 80%, white);
    border: 1px solid rgba(255,255,255,.12); color: var(--term-fg);
  }
  #detail .menu button { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.14); color: var(--term-fg); }
  #detail .menu button.danger { color: var(--ansi-9); }
  #detail .menu .q { color: rgba(214,214,220,.6); }
  #detail .bar { position: relative; }
  #detail.notfound #moreBtn { visibility: hidden; }
  .agent.blocked { border-left: 3px solid var(--blocked); }
  .status {
    flex: none; width: 11px; height: 11px; border-radius: 50%;
    background: var(--unknown);
  }
  .status.working { background: var(--working); animation: pulse 1.4s ease-out infinite; }
  .status.idle { background: var(--idle); }
  .status.done { background: var(--done); }
  .status.blocked { background: var(--blocked); animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, transparent); }
    0.1% { box-shadow: 0 0 0 0 var(--working-ring, rgba(217,119,6,.45)); }
    100% { box-shadow: 0 0 0 9px rgba(217,119,6,0); }
  }
  .status.blocked { --working-ring: rgba(220,38,38,.45); }
  .agent .meta { min-width: 0; flex: 1; }
  .agent .title {
    display: block;
    font-weight: 550; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agent .sub {
    display: block;
    font-size: 13px; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agent .sub .state { text-transform: capitalize; }
  .agent svg.chev { flex: none; width: 16px; height: 16px; stroke: var(--text-2); }

  #home .note { font-size: 13px; color: var(--text-2); text-align: center; padding-top: 8px; }

  /* ---- Detail ---- */
  #detail {
    position: fixed; inset: 0; z-index: 10;
    display: none; flex-direction: column;
    background: var(--term-bg);
  }
  #detail.open { display: flex; }
  #detail .bar {
    flex: none;
    display: flex; align-items: center; gap: 4px;
    padding: calc(env(safe-area-inset-top) + 6px) max(8px, env(safe-area-inset-right)) 6px max(4px, env(safe-area-inset-left));
    background: color-mix(in srgb, var(--term-bg) 88%, white);
    border-bottom: 1px solid rgba(255,255,255,.08);
    color: var(--term-fg);
  }
  #detail .bar .titlebox { min-width: 0; flex: 1; }
  #detail .bar .t {
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #detail .bar .s {
    font-size: 12px; color: rgba(214,214,220,.55);
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap; overflow: hidden;
  }
  #detail .bar .s .status { width: 8px; height: 8px; }
  #detail .bar .s .live { display: none; align-items: center; gap: 4px; color: var(--done); }
  #detail .bar .s .live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--done); }
  #detail.live .bar .s .live { display: inline-flex; }
  #detail.notfound #composer, #detail.notfound #refreshBtn { visibility: hidden; }
  .iconbtn {
    flex: none; width: 44px; height: 44px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--term-fg);
  }
  .iconbtn:active { background: rgba(255,255,255,.1); }
  .iconbtn svg { width: 20px; height: 20px; stroke: currentColor; }
  .iconbtn.spin svg { animation: spin .7s linear infinite; }
  #ansiBtn { font-size: 15px; font-weight: 600; letter-spacing: -.02em; opacity: .45; }
  #ansiBtn[aria-pressed="true"] {
    opacity: 1;
    background: linear-gradient(90deg, var(--ansi-1), var(--ansi-3), var(--ansi-2), var(--ansi-4), var(--ansi-5));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #detail.notfound #ansiBtn { visibility: hidden; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #out {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 12px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left));
  }
  #out pre {
    font: 12px/1.45 ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    color: var(--term-fg);
    white-space: pre-wrap; word-break: break-word;
  }
  #earlierBtn {
    display: block; margin: 0 auto 10px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06);
    color: var(--term-fg); font: 12px system-ui, sans-serif; cursor: pointer;
  }
  #earlierBtn:disabled { opacity: .5; cursor: default; }
  #earlierBtn[hidden] { display: none; }
  #outOlder:empty { display: none; }
  #out .placeholder { color: rgba(214,214,220,.45); font-size: 14px; padding: 24px 8px; text-align: center; }
  #out .a-b { font-weight: 700; }
  #out .a-d { opacity: .6; }
  #out .a-i { font-style: italic; }
  #out .a-u { text-decoration: underline; }
  #out .a-s { text-decoration: line-through; }
  #out .a-u.a-s { text-decoration: underline line-through; }
  #out .af-0 { color: var(--ansi-0); } #out .ab-0 { background-color: var(--ansi-0); }
  #out .af-1 { color: var(--ansi-1); } #out .ab-1 { background-color: var(--ansi-1); }
  #out .af-2 { color: var(--ansi-2); } #out .ab-2 { background-color: var(--ansi-2); }
  #out .af-3 { color: var(--ansi-3); } #out .ab-3 { background-color: var(--ansi-3); }
  #out .af-4 { color: var(--ansi-4); } #out .ab-4 { background-color: var(--ansi-4); }
  #out .af-5 { color: var(--ansi-5); } #out .ab-5 { background-color: var(--ansi-5); }
  #out .af-6 { color: var(--ansi-6); } #out .ab-6 { background-color: var(--ansi-6); }
  #out .af-7 { color: var(--ansi-7); } #out .ab-7 { background-color: var(--ansi-7); }
  #out .af-8 { color: var(--ansi-8); } #out .ab-8 { background-color: var(--ansi-8); }
  #out .af-9 { color: var(--ansi-9); } #out .ab-9 { background-color: var(--ansi-9); }
  #out .af-10 { color: var(--ansi-10); } #out .ab-10 { background-color: var(--ansi-10); }
  #out .af-11 { color: var(--ansi-11); } #out .ab-11 { background-color: var(--ansi-11); }
  #out .af-12 { color: var(--ansi-12); } #out .ab-12 { background-color: var(--ansi-12); }
  #out .af-13 { color: var(--ansi-13); } #out .ab-13 { background-color: var(--ansi-13); }
  #out .af-14 { color: var(--ansi-14); } #out .ab-14 { background-color: var(--ansi-14); }
  #out .af-15 { color: var(--ansi-15); } #out .ab-15 { background-color: var(--ansi-15); }
  #out .placeholder a { color: var(--accent); }

  #composer {
    flex: none;
    padding: 8px max(10px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 8px) max(10px, env(safe-area-inset-left));
    background: color-mix(in srgb, var(--term-bg) 88%, white);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  #composer .keys {
    display: flex; gap: 8px; padding-bottom: 8px;
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  #composer .keys::-webkit-scrollbar { display: none; }
  #composer .keys button {
    flex: none; height: 34px; padding: 0 14px; border-radius: 8px;
    font: 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--term-fg);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
  }
  #composer .keys button:active { background: rgba(255,255,255,.18); }
  #composer form { display: flex; gap: 8px; align-items: flex-end; }
  #composer textarea {
    flex: 1; min-width: 0;
    height: 44px; min-height: 44px; max-height: 40vh;
    padding: 11px 14px; border-radius: 11px;
    font: 14px/20px ui-monospace, "SF Mono", Menlo, monospace;
    color: var(--term-fg);
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
    resize: none; overflow-y: auto;
  }
  #composer textarea::placeholder { color: rgba(214,214,220,.4); }
  #composer .send {
    flex: none; width: 44px; height: 44px; border-radius: 11px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff;
  }
  #composer .send:disabled { opacity: .45; }
  #composer .keymode {
    flex: none; width: 44px; height: 44px; border-radius: 11px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1; color: var(--term-fg);
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14);
  }
  #composer .keymode[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #composer.keymode-on textarea { border-color: var(--accent); }
  #composer .send svg { width: 18px; height: 18px; stroke: currentColor; }

  /* ---- New-agent bottom sheet ---- */
  #sheet {
    position: fixed; inset: 0; z-index: 15; display: none;
    background: rgba(0,0,0,.45);
  }
  #sheet.open { display: block; }
  #sheet form {
    position: absolute; left: 0; right: 0; bottom: 0;
    max-width: 640px; margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 16px) max(16px, env(safe-area-inset-left));
    background: var(--surface); color: var(--text);
    border-radius: 18px 18px 0 0; border-top: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px;
  }
  #sheet h3 { font-size: 16px; font-weight: 600; }
  #sheet label { font-size: 12px; color: var(--text-2); display: block; margin-bottom: 4px; }
  #sheet input[type="text"] {
    width: 100%; height: 42px; padding: 0 12px; border-radius: 10px;
    font: 14px/1 ui-monospace, "SF Mono", Menlo, monospace; color: var(--text);
    background: var(--surface-2); border: 1px solid var(--line);
  }
  #sheet .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  #sheet .chips button {
    height: 32px; padding: 0 12px; border-radius: 999px;
    font: 12px/1 ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--surface-2); border: 1px solid var(--line);
  }
  #sheet .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #sheet .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  #sheet .actions button { height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--line); }
  #sheet .actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #sheet .actions .primary:disabled { opacity: .5; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px);
    transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg);
    font-size: 13px; padding: 9px 16px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
    z-index: 20; max-width: 88vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<main id="home">
  <header class="app">
    <h1>herdr</h1>
    <span id="conn"><span class="dot"></span><span id="connLabel">connecting</span></span>
    <span id="attention" role="status"></span>
    <button type="button" id="notifyBtn" aria-pressed="false" aria-label="Notifications" title="Notifications off">🔔</button>
  </header>
  <div id="workspaces"><p class="note">Loading…</p></div>
</main>

<div id="detail" role="dialog" aria-modal="true">
  <div class="bar">
    <button class="iconbtn" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="titlebox">
      <div class="t" id="dTitle"></div>
      <div class="s"><span class="status" id="dStatus"></span><span id="dSub"></span><span class="live">live</span></div>
    </div>
    <button class="iconbtn" id="ansiBtn" aria-pressed="true" aria-label="Toggle ANSI colors" title="ANSI colors on">Aa</button>
    <button class="iconbtn" id="refreshBtn" aria-label="Refresh output">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="iconbtn" id="moreBtn" aria-label="Agent actions" aria-haspopup="menu" aria-expanded="false">⋯</button>
  </div>
  <div id="out">
    <button type="button" id="earlierBtn" hidden>Show earlier output</button>
    <pre id="outOlder"></pre><pre id="outText"></pre>
  </div>
  <div id="composer">
    <div class="keys">
      <button type="button" data-key="enter">Enter</button>
      <button type="button" data-key="esc">Esc</button>
      <button type="button" data-key="ctrl+c">Ctrl+C</button>
      <button type="button" data-key="up" aria-label="Up">↑</button>
      <button type="button" data-key="down" aria-label="Down">↓</button>
      <button type="button" data-key="left" aria-label="Left">←</button>
      <button type="button" data-key="right" aria-label="Right">→</button>
      <button type="button" data-key="tab">Tab</button>
      <button type="button" data-key="shift+tab">Shift+Tab</button>
    </div>
    <form id="sendForm">
      <button class="keymode" type="button" id="keyModeBtn" aria-pressed="false" aria-label="Toggle keystroke mode" title="Send input as keystrokes">⌨</button>
      <textarea id="sendInput" rows="1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Send text to agent…" aria-label="Text to send"></textarea>
      <button class="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <form id="sheetForm">
    <h3 id="sheetTitle">New agent</h3>
    <div>
      <label for="naName">Name</label>
      <input type="text" id="naName" maxlength="64" required autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div>
      <label for="naCwd">Directory</label>
      <input type="text" id="naCwd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="/path/to/project">
    </div>
    <div>
      <label for="naCmd">Command</label>
      <div class="chips">
        <button type="button" data-cmd="claude">claude</button>
        <button type="button" data-cmd="claude --continue">claude --continue</button>
        <button type="button" data-cmd="codex">codex</button>
      </div>
      <input type="text" id="naCmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="custom command (split on whitespace, no shell)">
    </div>
    <div class="actions">
      <button type="button" id="naCancel">Cancel</button>
      <button type="submit" class="primary" id="naSubmit">Start</button>
    </div>
  </form>
</div>

<div id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let token = localStorage.getItem('herdr_token') || '';
  let overview = { workspaces: [] };
  let current = null;          // agent object currently open in detail
  let pollTimer = null;
  let es = null;
  let refetchTimer = null;
  let cameFromHome = false;    // detail was opened by in-app navigation
  let lastEventRev = -1;       // newest pane_updated revision seen for the open pane
  let outDebounce = null;
  let outFetching = false;
  let outQueued = false;
  let lastOutputAt = 0;
  let paneEs = null;         // per-pane live SSE stream
  let paneLive = false;
  // Scrollback beyond the live tail: lines [older.start, older.end) of the
  // server-side history, rendered above the tail. tailStart is the history
  // index of the tail's first line.
  let older = { start: 0, end: 0, text: '' };
  let tailStart = 0;
  let olderLoading = false;

  // ---- API ----
  async function api(path, opts = {}) {
    const headers = Object.assign({}, opts.headers);
    if (token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch(path, Object.assign({}, opts, { headers }));
    if (res.status === 401) {
      const t = prompt('Access token for herdr-web:');
      if (t) { token = t.trim(); localStorage.setItem('herdr_token', token); return api(path, opts); }
      throw new Error('unauthorized');
    }
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || res.statusText);
    return body;
  }

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2600);
  }

  const basename = (p) => (p || '').replace(/\/+$/, '').split('/').pop() || p || '';
  // Event titles keep the agent's spinner glyph; drop leading symbols.
  const cleanTitle = (t) => (t || '').replace(/^[^\p{L}\p{N}]+\s*/u, '');
  // A user-set name wins over the terminal title; plain shells have no agent.
  const agentTitle = (a) => a.name || cleanTitle(a.terminal_title_stripped || a.terminal_title) || a.agent || 'process';
  const agentKind = (a) => a.agent || 'process';
  const postJSON = (path, body) => api(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body ?? {}),
  });

  // ---- Home rendering ----
  // Blocked agents first, then most recently active; sessions with no known
  // activity keep their herdr order at the end (Array#sort is stable).
  function byRecency(agents) {
    return [...agents].sort((x, y) => {
      const xb = x.agent_status === 'blocked', yb = y.agent_status === 'blocked';
      if (xb !== yb) return xb ? -1 : 1;
      const a = typeof x.last_activity_at === 'number' ? x.last_activity_at : null;
      const b = typeof y.last_activity_at === 'number' ? y.last_activity_at : null;
      if (a === b) return 0;
      if (a === null) return 1;
      if (b === null) return -1;
      return b - a;
    });
  }

  function renderAttention() {
    let n = 0;
    for (const ws of overview.workspaces) for (const a of ws.agents) if (a.agent_status === 'blocked') n++;
    document.title = (n ? `(${n}) ` : '') + 'herdr';
    const pill = $('attention');
    pill.textContent = n === 1 ? '1 needs attention' : n + ' need attention';
    pill.classList.toggle('show', n > 0);
  }

  let renderedSig = null;
  let cardMenuOpen = null;   // terminal_id whose card menu / inline rename is open
  let renderPending = false;
  function render() {
    renderAttention();
    // Don't repaint under an open card menu or inline rename; catch up on close.
    if (cardMenuOpen) { renderPending = true; return; }
    renderPending = false;
    const root = $('workspaces');
    const sections = overview.workspaces.map((ws) => ({ ws, agents: byRecency(ws.agents) }));
    // Timestamps tick constantly; only touch the DOM when something visible moved.
    // Compare what is actually displayed: raw titles carry a spinner glyph
    // that changes on every tick but is stripped before rendering.
    const sig = JSON.stringify(sections.map(({ ws, agents }) =>
      [ws.workspace_id, ws.label, agents.map((a) =>
        [a.terminal_id, a.agent_status, agentTitle(a), a.agent, basename(a.cwd)])]));
    if (sig === renderedSig) return;
    renderedSig = sig;
    root.replaceChildren();
    if (!overview.workspaces.length) {
      root.innerHTML = '<p class="note">No workspaces. Is the herdr server running?</p>';
      return;
    }
    for (const { ws, agents } of sections) {
      const sec = document.createElement('section');
      sec.className = 'ws';
      const h = document.createElement('h2');
      h.textContent = ws.label || ('Workspace ' + ws.number);
      const c = document.createElement('span');
      c.className = 'count';
      c.textContent = agents.length === 1 ? '1 agent' : agents.length + ' agents';
      h.appendChild(c);
      const add = document.createElement('button');
      add.type = 'button';
      add.className = 'add';
      add.setAttribute('aria-label', 'New agent in ' + (ws.label || 'workspace ' + ws.number));
      add.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
      add.addEventListener('click', () => openSheet(ws));
      h.appendChild(add);
      sec.appendChild(h);
      if (!agents.length) {
        const p = document.createElement('p');
        p.className = 'empty-ws';
        p.textContent = 'No agents in this workspace.';
        sec.appendChild(p);
      }
      for (const a of agents) sec.appendChild(agentCard(a));
      root.appendChild(sec);
    }
  }

  function agentCard(a) {
    const card = document.createElement('div');
    card.className = 'agent' + (a.agent_status === 'blocked' ? ' blocked' : '');
    card.dataset.pane = a.pane_id;
    // A div with role=button: the title swaps to an <input> on rename, which
    // cannot live inside a real <button>.
    const open = document.createElement('div');
    open.className = 'open';
    open.setAttribute('role', 'button');
    open.tabIndex = 0;
    const dot = document.createElement('span');
    dot.className = 'status ' + (a.agent_status || 'unknown');
    const meta = document.createElement('span');
    meta.className = 'meta';
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = agentTitle(a);
    const sub = document.createElement('span');
    sub.className = 'sub';
    const state = document.createElement('span');
    state.className = 'state';
    state.textContent = a.agent_status || 'unknown';
    sub.append(state, ' · ' + agentKind(a) + ' · ' + basename(a.cwd));
    meta.append(title, sub);
    open.append(dot, meta);
    open.insertAdjacentHTML('beforeend',
      '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>');
    const go = () => {
      cameFromHome = true;
      location.hash = '#/agent/' + encodeURIComponent(a.terminal_id);
    };
    open.addEventListener('click', (ev) => { if (!ev.target.closest('input')) go(); });
    open.addEventListener('keydown', (ev) => {
      if ((ev.key === 'Enter' || ev.key === ' ') && !ev.target.closest('input')) { ev.preventDefault(); go(); }
    });
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'more';
    more.textContent = '⋯';
    more.setAttribute('aria-label', 'Actions for ' + agentTitle(a));
    more.setAttribute('aria-haspopup', 'menu');
    more.setAttribute('aria-expanded', 'false');
    more.addEventListener('click', () => toggleMenu(card, more, a, title));
    card.append(open, more);
    return card;
  }

  // ---- Card / detail action menu: Rename (inline) and Close (two-tap) ----
  function closeMenus() {
    document.querySelectorAll('.menu').forEach((m) => m.remove());
    document.querySelectorAll('[aria-haspopup="menu"]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
    const wasOpen = cardMenuOpen;
    cardMenuOpen = null;
    if (wasOpen && renderPending) render();
  }

  // Builds the menu into `host`; `titleEl` is what gets swapped for the rename input.
  function buildMenu(host, trigger, a, titleEl, opts) {
    const menu = document.createElement('div');
    menu.className = 'menu';
    menu.setAttribute('role', 'menu');
    const mk = (label, cls, fn) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      if (cls) b.className = cls;
      b.setAttribute('role', 'menuitem');
      b.addEventListener('click', fn);
      return b;
    };
    const showMain = () => {
      menu.replaceChildren(
        mk('Rename', '', () => { menu.remove(); trigger.setAttribute('aria-expanded', 'false'); inlineRename(a, titleEl, opts.onDone); }),
        mk('Close', 'danger', showConfirm),
      );
    };
    const showConfirm = () => {
      const q = document.createElement('span');
      q.className = 'q';
      q.textContent = 'Close this agent?';
      menu.replaceChildren(q, mk('Yes', 'danger', async () => {
        try {
          await postJSON('/api/panes/' + encodeURIComponent(a.pane_id) + '/close');
          toast('Closed ' + agentTitle(a));
          closeMenus();
          opts.onClosed?.();
        } catch (e) { toast('Close failed: ' + e.message); }
      }), mk('No', '', showMain));
    };
    showMain();
    host.appendChild(menu);
    trigger.setAttribute('aria-expanded', 'true');
    return menu;
  }

  function toggleMenu(card, more, a, titleEl) {
    const already = card.querySelector('.menu');
    closeMenus();
    if (already) return;
    cardMenuOpen = a.terminal_id;
    buildMenu(card, more, a, titleEl, {
      onDone: () => { cardMenuOpen = null; if (renderPending) render(); },
    });
  }

  // Swaps the title for an input: Enter/blur saves, Esc cancels, empty clears.
  function inlineRename(a, titleEl, onDone) {
    if (titleEl.querySelector('input')) return;
    const prev = titleEl.textContent;
    const input = document.createElement('input');
    input.type = 'text';
    input.maxLength = 64;
    input.value = a.name || '';
    input.placeholder = prev;
    input.setAttribute('aria-label', 'Agent name');
    titleEl.replaceChildren(input);
    let finished = false;
    const finish = async (save) => {
      if (finished) return;
      finished = true;
      const next = input.value.trim();
      titleEl.textContent = save && next ? next : prev;
      if (save && next !== (a.name || '')) {
        try {
          await postJSON('/api/agents/' + encodeURIComponent(a.terminal_id) + '/rename', { name: next || null });
          toast(next ? 'Renamed' : 'Name cleared');
        } catch (e) {
          titleEl.textContent = prev;
          toast('Rename failed: ' + e.message);
        }
      }
      onDone?.();
    };
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
    input.focus();
    input.select();
  }

  // Tap outside dismisses any open menu (not while an inline rename has focus).
  document.addEventListener('pointerdown', (ev) => {
    if (ev.target.closest('.menu, .more, #moreBtn, .title input, #dTitle input')) return;
    if (document.querySelector('.menu')) closeMenus();
  });

  $('moreBtn').addEventListener('click', () => {
    if (!current) return;
    const bar = $('moreBtn').parentElement;
    const already = bar.querySelector('.menu');
    closeMenus();
    if (already) return;
    buildMenu(bar, $('moreBtn'), current, $('dTitle'), {
      onClosed: () => { location.hash = '#/'; },
    });
  });

  // ---- New-agent sheet ----
  const PRESETS = ['claude', 'claude --continue', 'codex'];
  let sheetWs = null;

  function syncChips() {
    const v = $('naCmd').value.trim().replace(/\s+/g, ' ');
    document.querySelectorAll('#sheet .chips button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cmd === v)));
  }

  function openSheet(ws) {
    sheetWs = ws;
    $('naName').value = '';
    // workspace.list has no cwd; use the worktree checkout or where its agents run.
    $('naCwd').value = ws.worktree?.checkout_path || ws.agents.find((a) => a.cwd)?.cwd || '';
    $('naCmd').value = PRESETS[0];
    syncChips();
    $('sheetTitle').textContent = 'New agent in ' + (ws.label || 'workspace ' + ws.number);
    $('sheet').classList.add('open');
    $('naName').focus();
  }

  function closeSheet() {
    sheetWs = null;
    $('sheet').classList.remove('open');
  }

  document.querySelectorAll('#sheet .chips button').forEach((b) => {
    b.addEventListener('click', () => { $('naCmd').value = b.dataset.cmd; syncChips(); });
  });
  $('naCmd').addEventListener('input', syncChips);
  $('naCancel').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', (ev) => { if (ev.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && $('sheet').classList.contains('open')) closeSheet();
  });

  $('sheetForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!sheetWs) return;
    const name = $('naName').value.trim();
    const cwd = $('naCwd').value.trim();
    const argv = $('naCmd').value.trim().split(/\s+/).filter(Boolean);
    if (!name) { toast('Name is required'); return; }
    if (!argv.length) { toast('Command is required'); return; }
    const btn = $('naSubmit');
    btn.disabled = true;
    try {
      const r = await postJSON('/api/agents', { name, cwd: cwd || null, workspace_id: sheetWs.workspace_id, argv });
      toast('Started ' + name);
      closeSheet();
      await loadOverview();
      const id = r?.agent?.terminal_id;
      if (id) { cameFromHome = true; location.hash = '#/agent/' + encodeURIComponent(id); }
    } catch (e) {
      toast('Start failed: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  });

  async function loadOverview() {
    try {
      overview = await api('/api/overview');
      render();
      if (current) {
        const fresh = findAgent(current.terminal_id);
        if (fresh) { current = fresh; updateDetailHeader(); }
      }
    } catch (e) {
      // fetch() throws a TypeError when the network itself is down (offline PWA shell).
      if (e instanceof TypeError || navigator.onLine === false) {
        setConn('offline');
        $('workspaces').innerHTML = '<p class="note">Offline — cannot reach herdr-web.</p>';
        return;
      }
      $('workspaces').innerHTML = '<p class="note">Cannot reach herdr: ' + e.message + '</p>';
    }
  }

  function findAgent(terminalId) {
    for (const ws of overview.workspaces)
      for (const a of ws.agents)
        if (a.terminal_id === terminalId) return a;
    return null;
  }

  // ---- Router: #/ = home, #/agent/<terminal_id> = detail ----
  function route() {
    const m = location.hash.match(/^#\/agent\/(.+)$/);
    if (m) showAgent(decodeURIComponent(m[1]));
    else hideDetail();
  }
  window.addEventListener('hashchange', route);

  async function showAgent(terminalId) {
    if (!overview.workspaces.length) await loadOverview(); // deep link: resolve id first
    const a = findAgent(terminalId);
    if (!a) return showNotFound(terminalId);
    current = a;
    lastEventRev = -1;
    resetOlder();
    updateDetailHeader();
    $('outText').textContent = '';
    $('out').querySelector('.placeholder')?.remove();
    $('detail').classList.remove('notfound');
    $('detail').classList.add('open');
    loadOutput();
    openPaneStream();
  }

  function showNotFound(terminalId) {
    current = null;
    $('dTitle').textContent = 'Session not found';
    $('dStatus').className = 'status unknown';
    $('dSub').textContent = terminalId;
    $('outText').textContent = '';
    $('out').querySelector('.placeholder')?.remove();
    const p = document.createElement('div');
    p.className = 'placeholder';
    p.append('This session no longer exists. ');
    const link = document.createElement('a');
    link.href = '#/';
    link.textContent = 'Back to home';
    p.appendChild(link);
    $('out').appendChild(p);
    $('detail').classList.add('open', 'notfound');
  }

  function hideDetail() {
    closeMenus();
    current = null;
    cameFromHome = false;
    outQueued = false;
    clearTimeout(outDebounce);
    closePaneStream();
    $('detail').classList.remove('open', 'notfound');
  }

  $('backBtn').addEventListener('click', () => {
    // Deep-linked pages have no home entry to go back to.
    if (cameFromHome) history.back();
    else location.hash = '#/';
  });

  function updateDetailHeader() {
    if (!current) return;
    if (!$('dTitle').querySelector('input')) $('dTitle').textContent = agentTitle(current);
    $('dStatus').className = 'status ' + (current.agent_status || 'unknown');
    $('dSub').textContent = (current.agent_status || 'unknown') + ' · ' + (current.cwd || '');
  }

  // ---- ANSI SGR -> DOM ----
  // Matches CSI, OSC (BEL/ST terminated) and any other two-byte escape; only
  // SGR (CSI ... m) is interpreted, everything else is dropped.
  const ANSI_RE = /\x1b\[[0-9;?]*[ -\/]*[@-~]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[\s\S]?/g;
  const ANSI_DEFAULT = { bold: 0, dim: 0, italic: 0, underline: 0, inverse: 0, strike: 0, fg: null, bg: null };

  // xterm 256 palette: 0-15 -> theme class index, 16-231 color cube, 232-255 grayscale.
  function ansi256(n) {
    if (n < 16) return n;
    if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }
    n -= 16;
    const c = (i) => (i ? 55 + i * 40 : 0);
    return `rgb(${c(Math.floor(n / 36))},${c(Math.floor(n / 6) % 6)},${c(n % 6)})`;
  }

  function applySgr(params, st) {
    const p = params.split(';').map((x) => (x === '' ? 0 : Number(x)));
    for (let i = 0; i < p.length; i++) {
      const n = p[i];
      if (n === 0) Object.assign(st, ANSI_DEFAULT);
      else if (n === 1) st.bold = 1;
      else if (n === 2) st.dim = 1;
      else if (n === 3) st.italic = 1;
      else if (n === 4) st.underline = 1;
      else if (n === 7) st.inverse = 1;
      else if (n === 9) st.strike = 1;
      else if (n === 22) st.bold = st.dim = 0;
      else if (n === 23) st.italic = 0;
      else if (n === 24) st.underline = 0;
      else if (n === 27) st.inverse = 0;
      else if (n === 29) st.strike = 0;
      else if (n === 39) st.fg = null;
      else if (n === 49) st.bg = null;
      else if (n >= 30 && n <= 37) st.fg = n - 30;
      else if (n >= 90 && n <= 97) st.fg = n - 82;
      else if (n >= 40 && n <= 47) st.bg = n - 40;
      else if (n >= 100 && n <= 107) st.bg = n - 92;
      else if (n === 38 || n === 48) {
        const k = n === 38 ? 'fg' : 'bg';
        if (p[i + 1] === 5) { st[k] = ansi256(Math.min(255, p[i + 2] | 0)); i += 2; }
        else if (p[i + 1] === 2) { st[k] = `rgb(${p[i + 2] | 0},${p[i + 3] | 0},${p[i + 4] | 0})`; i += 4; }
      }
    }
  }

  const sgrKey = (s) => `${s.bold}${s.dim}${s.italic}${s.underline}${s.inverse}${s.strike}|${s.fg}|${s.bg}`;
  const SGR_PLAIN = sgrKey(ANSI_DEFAULT);

  function sgrSpan(st, text) {
    const span = document.createElement('span');
    let fg = st.fg, bg = st.bg;
    if (st.inverse) [fg, bg] = [bg ?? 'var(--term-bg)', fg ?? 'var(--term-fg)'];
    let cls = '';
    if (st.bold) cls += ' a-b';
    if (st.dim) cls += ' a-d';
    if (st.italic) cls += ' a-i';
    if (st.underline) cls += ' a-u';
    if (st.strike) cls += ' a-s';
    if (typeof fg === 'number') cls += ' af-' + fg; else if (fg !== null) span.style.color = fg;
    if (typeof bg === 'number') cls += ' ab-' + bg; else if (bg !== null) span.style.backgroundColor = bg;
    if (cls) span.className = cls.slice(1);
    span.textContent = text;
    return span;
  }

  // One pass; consecutive text with the same style is coalesced into one node.
  function renderAnsi(text) {
    const frag = document.createDocumentFragment();
    const st = Object.assign({}, ANSI_DEFAULT);
    let cur = st, curKey = SGR_PLAIN, run = '', last = 0;
    const flush = () => {
      if (run) frag.appendChild(curKey === SGR_PLAIN ? document.createTextNode(run) : sgrSpan(cur, run));
      run = '';
    };
    ANSI_RE.lastIndex = 0;
    for (let m; (m = ANSI_RE.exec(text));) {
      run += text.slice(last, m.index);
      last = m.index + m[0].length;
      const seq = m[0];
      if (seq[1] !== '[' || seq[seq.length - 1] !== 'm' || seq.length < 3) continue;
      const params = seq.slice(2, -1);
      if (/[^0-9;]/.test(params)) continue; // private/intermediate bytes: not SGR
      applySgr(params, st);
      const key = sgrKey(st);
      if (key === curKey) continue;
      flush();
      cur = Object.assign({}, st);
      curKey = key;
    }
    run += text.slice(last);
    flush();
    return frag;
  }

  // ---- Output rendering (ANSI toggle) ----
  const ANSI_KEY = 'herdr_ansi';
  let ansiOn = localStorage.getItem(ANSI_KEY) !== '0';
  const readFormat = () => (ansiOn ? 'ansi' : 'text');

  function renderAnsiBtn() {
    const b = $('ansiBtn');
    b.setAttribute('aria-pressed', String(ansiOn));
    b.title = ansiOn ? 'ANSI colors on' : 'ANSI colors off';
  }
  $('ansiBtn').addEventListener('click', () => {
    ansiOn = !ansiOn;
    localStorage.setItem(ANSI_KEY, ansiOn ? '1' : '0');
    renderAnsiBtn();
    if (current) { resetOlder(); loadOutput(); openPaneStream(); } // refetch/reopen with the new format
  });
  renderAnsiBtn();

  // Claude's TUI brackets its prompt with box-drawing rules; drop those lines,
  // keeping their escapes so SGR state carries over.
  const BOX_ONLY = /^[\s\u2500-\u257f]*$/;
  function stripRules(text) {
    const lines = [];
    for (const ln of text.split('\n')) {
      const bare = ln.replace(ANSI_RE, '');
      if (BOX_ONLY.test(bare) && /[\u2500-\u257f]/.test(bare)) {
        const esc = (ln.match(ANSI_RE) || []).join('');
        if (esc && lines.length) lines[lines.length - 1] += esc;
        continue;
      }
      lines.push(ln);
    }
    return lines.join('\n');
  }

  function renderInto(el, text) {
    if (ansiOn) el.replaceChildren(renderAnsi(text));
    else el.textContent = text;
  }

  // Render output text, keeping the user's place unless they're at the bottom.
  // start/total are the tail's coordinates in the server-side history.
  function renderOutput(text, start = 0, total = null) {
    text = (text || '').replace(/\r/g, '');
    if (total !== null && total < older.end) resetOlder(); // pane history restarted
    tailStart = start;
    if (older.end > start) text = text.split('\n').slice(older.end - start).join('\n'); // overlap
    else if (older.end && start > older.end) fillGap(older.end, start);
    text = stripRules(text).replace(/(?:\s|\x1b\[[0-9;]*m)+$/, '');
    updateEarlierBtn();
    const out = $('out');
    const stick = out.scrollTop + out.clientHeight >= out.scrollHeight - 60;
    renderInto($('outText'), text);
    out.querySelector('.placeholder')?.remove();
    if (!text && !older.text) {
      const p = document.createElement('div');
      p.className = 'placeholder';
      p.textContent = 'No output yet.';
      out.appendChild(p);
    }
    if (stick) out.scrollTop = out.scrollHeight;
    lastOutputAt = Date.now();
  }

  async function loadOutput() {
    if (!current) return;
    if (outFetching) { outQueued = true; return; } // never two fetches at once
    outFetching = true;
    const btn = $('refreshBtn');
    btn.classList.add('spin');
    try {
      const fmt = readFormat();
      const r = await api('/api/agents/' + encodeURIComponent(current.terminal_id) + '/output?lines=1000&source=recent&format=' + fmt);
      if (fmt === readFormat()) renderOutput(r.text ?? '', r.start ?? 0, r.total ?? null);
    } catch (e) {
      toast('Read failed: ' + e.message);
    } finally {
      btn.classList.remove('spin');
      outFetching = false;
      if (outQueued) { outQueued = false; loadOutput(); } // newer revision arrived mid-fetch
    }
  }
  $('refreshBtn').addEventListener('click', () => loadOutput());

  // ---- Earlier output (server-side history beyond herdr's 1000-line read) ----
  function resetOlder() {
    older = { start: 0, end: 0, text: '' };
    tailStart = 0;
    $('outOlder').textContent = '';
    updateEarlierBtn();
  }

  function earlierAvailable() {
    return current && (older.end ? older.start : tailStart) > 0;
  }

  function updateEarlierBtn() {
    const b = $('earlierBtn');
    b.hidden = !earlierAvailable() && !olderLoading;
    b.disabled = olderLoading;
    b.textContent = olderLoading ? 'Loading…' : 'Show earlier output';
  }

  function renderOlder() {
    renderInto($('outOlder'), stripRules(older.text));
  }

  async function loadEarlier() {
    if (olderLoading || !earlierAvailable()) return;
    const before = older.end ? older.start : tailStart;
    const out = $('out');
    olderLoading = true;
    updateEarlierBtn();
    try {
      const r = await api('/api/agents/' + encodeURIComponent(current.terminal_id)
        + '/history?before=' + before + '&lines=1000&format=' + readFormat());
      const prevH = out.scrollHeight, prevTop = out.scrollTop;
      older.text = older.text ? r.text + '\n' + older.text : r.text;
      older.start = r.start;
      if (!older.end) older.end = r.end;
      renderOlder();
      out.scrollTop = prevTop + (out.scrollHeight - prevH); // keep the viewed lines in place
    } catch (e) {
      toast('History failed: ' + e.message);
    } finally {
      olderLoading = false;
      updateEarlierBtn();
    }
  }
  $('earlierBtn').addEventListener('click', loadEarlier);

  // The live tail moved past the loaded block (a burst of output): fetch the
  // lines in between so the two stay contiguous.
  async function fillGap(from, to) {
    const id = current?.terminal_id;
    older.end = to; // claim the range first so concurrent renders don't refetch
    try {
      const r = await api('/api/agents/' + encodeURIComponent(id) + '/history?before=' + to + '&lines=' + (to - from) + '&format=' + readFormat());
      if (current?.terminal_id !== id) return;
      older.text = older.text ? older.text + '\n' + r.text : r.text;
      renderOlder();
    } catch { /* tail still renders; the gap shows on next reload */ }
  }

  // Scrolling up to the top loads more, like a chat history.
  let lastScrollTop = 0;
  $('out').addEventListener('scroll', () => {
    const out = $('out');
    const up = out.scrollTop < lastScrollTop;
    lastScrollTop = out.scrollTop;
    if (up && out.scrollTop < 120) loadEarlier();
  });

  // Coalesce pane_updated bursts with a trailing debounce.
  // Only a fallback: the per-pane stream renders directly while connected.
  function scheduleOutput(rev) {
    if (typeof rev === 'number') lastEventRev = Math.max(lastEventRev, rev);
    if (paneLive) return;
    clearTimeout(outDebounce);
    outDebounce = setTimeout(loadOutput, 400);
  }

  // Safety net when the per-pane stream is down: herdr's event queue can lag
  // far behind a fast-producing pane, so keep a working agent's output fresh.
  setInterval(() => {
    if (!paneLive && current && current.agent_status === 'working' && Date.now() - lastOutputAt > 9000) loadOutput();
  }, 10000);

  // ---- Per-pane live stream (near-real-time output) ----
  function setPaneLive(on) {
    paneLive = on;
    $('detail').classList.toggle('live', on);
  }

  function openPaneStream() {
    closePaneStream();
    if (!current) return;
    const url = '/api/agents/' + encodeURIComponent(current.terminal_id) + '/stream?format=' + readFormat()
      + (token ? '&token=' + encodeURIComponent(token) : '');
    paneEs = new EventSource(url);
    paneEs.onopen = () => setPaneLive(true);
    paneEs.addEventListener('output', (ev) => {
      setPaneLive(true);
      const d = JSON.parse(ev.data);
      renderOutput(d.text, d.start ?? 0, d.total ?? null);
    });
    paneEs.addEventListener('stream_error', () => closePaneStream()); // fall back to hints/polling
    paneEs.onerror = () => {
      // Non-200 (e.g. stream cap) closes for good; network errors keep retrying.
      setPaneLive(false);
      if (paneEs && paneEs.readyState === EventSource.CLOSED) paneEs = null;
    };
  }

  function closePaneStream() {
    if (paneEs) { paneEs.close(); paneEs = null; }
    setPaneLive(false);
  }

  function sendKeys(keys) {
    return api('/api/panes/' + encodeURIComponent(current.pane_id) + '/keys', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ keys }),
    });
  }

  // Composer grows with its content up to the CSS max-height, then scrolls.
  function autosize() {
    const ta = $('sendInput');
    ta.style.height = 'auto';
    ta.style.height = Math.max(44, ta.scrollHeight + 2) + 'px'; // +2: border-box borders
  }
  $('sendInput').addEventListener('input', autosize);

  // Enter submits on pointer devices, Shift+Enter breaks the line; on touch
  // there is no Shift, so Enter always breaks and the send button submits.
  const enterSubmits = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  $('sendInput').addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' || ev.isComposing) return;
    if ((ev.metaKey || ev.ctrlKey) || (enterSubmits && !ev.shiftKey && !ev.altKey)) {
      ev.preventDefault();
      $('sendForm').requestSubmit();
    }
  });

  // Keystroke mode: agent.send pastes, which interactive prompts (model
  // picker, y/n, numbered menus) ignore; pane.send_keys delivers real keys.
  let keyMode = false;
  $('keyModeBtn').addEventListener('click', () => {
    keyMode = !keyMode;
    $('keyModeBtn').setAttribute('aria-pressed', String(keyMode));
    $('composer').classList.toggle('keymode-on', keyMode);
    $('sendInput').placeholder = keyMode ? 'Keystrokes… (each char is a key)' : 'Send text to agent…';
    $('sendInput').focus();
  });

  $('sendForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!current) return;
    const input = $('sendInput');
    const text = input.value;
    if (!text) return;
    const btn = ev.target.querySelector('.send');
    btn.disabled = true;
    try {
      if (keyMode) {
        // No auto-Enter here: the user presses the Enter key button when ready.
        await sendKeys([...text].map((c) => (c === ' ' ? 'space' : c === '\n' ? 'enter' : c)));
      } else {
        await api('/api/agents/' + encodeURIComponent(current.terminal_id) + '/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        });
        // agent.send writes literal text without submitting; follow with Enter
        await new Promise((r) => setTimeout(r, 300));
        await sendKeys(['enter']);
      }
      input.value = '';
      autosize();
      setTimeout(loadOutput, 400);
    } catch (e) {
      toast('Send failed: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  });

  document.querySelectorAll('#composer .keys button').forEach((b) => {
    b.addEventListener('click', async () => {
      if (!current) return;
      try {
        await sendKeys([b.dataset.key]);
        setTimeout(loadOutput, 400);
      } catch (e) {
        toast('Key failed: ' + e.message);
      }
    });
  });

  // ---- Live updates: SSE with polling fallback ----
  function setConn(mode) {
    const el = $('conn');
    el.className = mode;
    $('connLabel').textContent = mode === 'live' ? 'live' : mode === 'poll' ? 'polling' : mode === 'offline' ? 'offline' : 'connecting';
  }

  function queueRefetch() {
    clearTimeout(refetchTimer);
    refetchTimer = setTimeout(loadOverview, 300);
  }

  // Apply an authoritative overview snapshot (from reads, not events).
  // Coalesced so a burst can't repaint the list repeatedly.
  let snapshotTimer = null;
  function applySnapshot(snapshot) {
    overview = snapshot;
    clearTimeout(snapshotTimer);
    snapshotTimer = setTimeout(() => {
      render();
      if (current) {
        const fresh = findAgent(current.terminal_id);
        if (fresh) { current = fresh; updateDetailHeader(); }
      }
    }, 500);
  }

  function startSSE() {
    // Wire event names use underscores (pane_updated), not the dotted subscription types.
    const url = '/api/events' + (token ? '?token=' + encodeURIComponent(token) : '');
    es = new EventSource(url);
    // Card status comes only from these authoritative snapshots.
    es.addEventListener('overview', (ev) => applySnapshot(JSON.parse(ev.data)));
    // pane_updated is now only an output-refresh hint for the open agent.
    es.addEventListener('pane_updated', (ev) => {
      const p = JSON.parse(ev.data).pane;
      if (p && current && current.pane_id === p.pane_id) scheduleOutput(p.revision);
    });
    es.addEventListener('connected', () => {
      if (current) { lastEventRev = -1; scheduleOutput(); }
    });
    es.addEventListener('status_changed', (ev) => notifyStatusChange(JSON.parse(ev.data)));
    es.onopen = () => { setConn('live'); stopPolling(); queueRefetch(); };
    es.onerror = () => { setConn(navigator.onLine === false ? 'offline' : 'poll'); startPolling(); };
  }

  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(() => {
      loadOverview();
      if (current) loadOutput();
    }, 10000);
  }
  function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      loadOverview();
      if (current) {
        loadOutput();
        // Mobile browsers kill EventSource in background; revive the stream.
        if (!paneEs || paneEs.readyState === EventSource.CLOSED) openPaneStream();
      }
    }
  });

  loadOverview().then(route);
  startSSE();

  // ---- Browser notifications (agent needs attention) ----
  const notifySupported = 'Notification' in window;
  const NOTIFY_OFF_KEY = 'herdr_notify_off';

  function notifyEnabled() {
    return notifySupported && Notification.permission === 'granted' && !localStorage.getItem(NOTIFY_OFF_KEY);
  }

  function renderNotifyBtn() {
    const b = $('notifyBtn');
    if (!notifySupported) return;
    b.classList.add('available');
    const denied = Notification.permission === 'denied';
    const on = notifyEnabled();
    b.classList.toggle('denied', denied);
    b.setAttribute('aria-pressed', String(on));
    b.title = denied ? 'Notifications blocked by the browser' : on ? 'Notifications on' : 'Notifications off';
  }

  if (notifySupported) {
    $('notifyBtn').addEventListener('click', async () => {
      if (Notification.permission === 'denied') { toast('Notifications are blocked in browser settings'); return; }
      if (notifyEnabled()) {
        localStorage.setItem(NOTIFY_OFF_KEY, '1');
      } else {
        localStorage.removeItem(NOTIFY_OFF_KEY);
        if (Notification.permission !== 'granted') {
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') toast(perm === 'denied' ? 'Notifications blocked' : 'Notifications need https');
        }
      }
      renderNotifyBtn();
    });
    renderNotifyBtn();
  }

  function notifyStatusChange(c) {
    if (!notifyEnabled()) return;
    // Skip when the user is already looking at this agent.
    if (!document.hidden && current && current.terminal_id === c.terminal_id) return;
    try {
      const n = new Notification(c.name + ' · ' + c.to, { body: c.workspace, tag: c.terminal_id, icon: '/icon-192.png' });
      n.onclick = () => { location.hash = '#/agent/' + encodeURIComponent(c.terminal_id); window.focus(); n.close(); };
    } catch (e) { /* e.g. Android requires SW-backed notifications */ }
  }

  // ---- PWA: offline static shell ----
  if ('serviceWorker' in navigator) {
    const notifyUpdate = () => toast('Updated — reload');
    navigator.serviceWorker.register('/sw.js').then((reg) => {
      if (reg.waiting && navigator.serviceWorker.controller) notifyUpdate();
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller) notifyUpdate();
        });
      });
    }).catch(() => { /* no https or unsupported: app works without it */ });
    navigator.serviceWorker.addEventListener('controllerchange', notifyUpdate);
  }
})();
</script>
</body>
</html>
